<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WXDC Order Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>WXDC Order Manager</h1>
    <h4 id="userInfo" class="text-secondary mt-2"></h4>
    <div class="list-group mt-4">
        <a href="/pending_orders" class="list-group-item list-group-item-action">View/Edit Pending Orders</a>
        <a href="/config/dates" class="list-group-item list-group-item-action">订餐日期配置</a>
        <a href="/config/req" class="list-group-item list-group-item-action">修改订餐规则</a>
        <button id="logoutBtn" class="list-group-item list-group-item-action text-danger mt-3" style="display: none;">退出登录 / 取消绑定</button>
    </div>

    <script type="module">
        // 当没有 token 时进入注册页面
        var token = await cookieStore.get('user_no');

        if (!token) {
            document.getElementById('userInfo').innerText = '当前状态：未登录（请通过微信获取有效链接）';
            // 如果需要跳转，可在这里恢复跳转到注册页逻辑
            // window.location.href = '/'; 
        } else {
            document.getElementById('userInfo').innerText = 'User NO: ' + token.value;
            
            // 只有 User NO 匹配时，额外显示取消绑定按钮
            if (token.value === '2241112') {
                var logoutBtn = document.getElementById('logoutBtn');
                logoutBtn.style.display = 'block';
                
                logoutBtn.addEventListener('click', async function() {
                    await cookieStore.delete('user_no');
                    localStorage.removeItem('token');
                    window.location.href = '/';
                });
            }
        }
    </script>
</body>
</html>
