services:
  wxdc:
    build: .
    image: berniehuang2008/wxdc:latest
    container_name: wxdc
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      CONFIG_PATH: /data/config.yaml
      RUN_WXDC_ON_START: "false"
      SMOKE_ONLY: "false"
      CRON_SCHEDULE_CURRENT: "0 13 * * 5"
      CRON_SCHEDULE_NEXT: "0 12 * * 0"
      CRON_LOG_FILE: /data/logs/wxdc.log
    volumes:
      - /data/wxdc:/data
