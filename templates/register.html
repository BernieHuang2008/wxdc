<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WXDC Register / Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Wxdc Register</h3>
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="studentId" class="form-label">学号</label>
                            <input type="text" class="form-control" id="studentId" required placeholder="请输入学号">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">统一身份认证系统密码</label>
                            <input type="password" class="form-control" id="password" required placeholder="请输入密码">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">邮箱</label>
                            <input type="email" class="form-control" id="email" required placeholder="用于接收通知的邮箱">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">注册 / 绑定</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const studentId = document.getElementById('studentId').value;
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value;

            // 调用后端注册 API endpoint
            fetch('/api/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    studentId: studentId,
                    password: password,
                    email: email
                })
            })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    // 假设后端返回了 token，我们存储它
                    document.write('注册成功！请检查你的邮箱以完成绑定。');
                } else {
                    alert('注册失败: ' + (data.message || '未知错误'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('网络或服务器错误，请稍后再试。');
            });
        });
    </script>
</body>
</html>
