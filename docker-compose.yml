services:
  wxdc:
    build: .
    image: berniehuang2008/wxdc:latest
    container_name: wxdc
    restart: unless-stopped
    ports:
      - 5008:5008
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      CONFIG_PATH: /data/config.yaml
      RUN_WXDC_ON_START: "false"
      SMOKE_ONLY: "false"
      CRON_SCHEDULE: "0 16 * * 5"
      CRON_LOG_FILE: /data/logs/wxdc-cron.log
    volumes:
      - /data/wxdc:/data
