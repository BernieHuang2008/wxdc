<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑订单 - {{ filename }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .meal-section {
            margin-bottom: 20px;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 5px;
        }

        .day-section {
            margin-bottom: 40px;
        }
    </style>
</head>

<body class="container mt-5 mb-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">首页</a></li>
            <li class="breadcrumb-item"><a href="/pending_orders">待处理订单</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ filename }}</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h1 class="h3 mb-0">编辑订单: {{ filename }}</h1>
        <div>
            <button onclick="saveOrder()" class="btn btn-primary btn-sm">保存修改</button>
            <button onclick="submitOrder()" class="btn btn-success btn-sm">提交订单</button>
        </div>
    </div>
    <div id="status-msg" class="alert d-none mt-3"></div>

    <div id="checksheet-container" class="mt-4"></div>

    <div id="order-container" class="mt-4">
        <!-- Content will be rendered by JS -->
    </div>

    <script>
        let orderData = {{ data | tojson }};
        const filename = "{{ filename }}";
        const weekdayLabels = ["日", "一", "二", "三", "四", "五", "六"];
        const mealLabels = {
            "breakfastorders": "早餐",
            "lunchorders": "午餐",
            "supperorders": "晚餐"
        };
        
        let selectedDayInfo = null;

        function renderChecksheet() {
            const container = document.getElementById('checksheet-container');
            container.innerHTML = '<h3>订单预览表</h3><p class="text-muted mb-2"><small>点击下方表格中的部分来编辑该餐的菜品。</small></p>';

            const table = document.createElement('table');
            table.className = 'table table-bordered table-striped text-center align-middle';

            // Header
            const thead = document.createElement('thead');
            thead.innerHTML = `
                <tr>
                    <th>日期</th>
                    <th>早餐</th>
                    <th>午餐</th>
                    <th>晚餐</th>
                </tr>
            `;
            table.appendChild(thead);

            const tbody = document.createElement('tbody');

            // Sort days
            const days = Object.keys(orderData).sort((a, b) => parseInt(a) - parseInt(b));

            days.forEach(dayKey => {
                const dayData = orderData[dayKey];
                const tr = document.createElement('tr');

                // Date column
                const dateTd = document.createElement('td');
                dateTd.innerHTML = `<strong>${weekdayLabels[Number(dayKey) % 7]}</strong><br><small>${dayData.date}</small>`;
                tr.appendChild(dateTd);

                // Meals
                ['breakfastorders', 'lunchorders', 'supperorders'].forEach(mealType => {
                    const td = document.createElement('td');
                    td.style.cursor = 'pointer';

                    // highlight selected
                    if (selectedDayInfo && selectedDayInfo.dayKey === dayKey && selectedDayInfo.mealType === mealType) {
                        td.classList.add('table-primary');
                        td.style.border = '2px solid #0d6efd';
                    }

                    if (dayData.auto_order && dayData.auto_order[mealType]) {
                        if (dayData.auto_order[mealType].length > 0) {
                            const counts = {};
                            dayData.auto_order[mealType].forEach(item => {
                                if (!counts[item.name]) {
                                    counts[item.name] = { qty: 0, price: item.price };
                                }
                                counts[item.name].qty += 1;
                            });
                            
                            const items = Object.entries(counts).map(([name, info]) => {
                                const priceDisplay = info.price !== undefined ? ` (¥${parseFloat(info.price)})` : '';
                                return info.qty > 1 
                                    ? `<span class="badge bg-secondary mb-1">${name}${priceDisplay} x${info.qty}</span>` 
                                    : `<span class="badge bg-secondary mb-1">${name}${priceDisplay}</span>`;
                            }).join('<br>');
                            
                            td.innerHTML = items;
                        } else {
                            td.innerHTML = '<span class="text-muted">-</span>';
                        }
                    } else {
                        // "N/A" -> "无" or equivalent
                        td.innerHTML = '<span class="text-muted text-decoration-line-through">无</span>';
                    }

                    td.onclick = () => {
                        selectedDayInfo = { dayKey, mealType };
                        renderChecksheet();
                        renderMenuGrid();
                    };

                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });

            table.appendChild(tbody);
            container.appendChild(table);
        }


        function renderMenuGrid() {
            const container = document.getElementById('order-container');
            container.innerHTML = '';

            if (!selectedDayInfo) {
                container.innerHTML = '<div class="alert alert-info">请在上方表格中选择要编辑的一餐。</div>';
                return;
            }

            const { dayKey, mealType } = selectedDayInfo;
            const dayData = orderData[dayKey];
            
            const header = document.createElement('h3');
            header.className = 'mb-3 border-bottom pb-2';
            header.innerHTML = `第 ${dayKey} 天 (${dayData.date}) - <span class="text-primary">${mealLabels[mealType] || mealType}</span>`;
            container.appendChild(header);

            if (!dayData.auto_order || !dayData.auto_order[mealType]) {
                container.innerHTML += '<p class="text-muted">此餐不可配置或未提供。</p>';
                return;
            }

            const availableMenu = (dayData.menu && dayData.menu[mealType]) || [];
            if (availableMenu.length === 0) {
                container.innerHTML += '<p class="text-muted">该餐暂无可用菜单。</p>';
                return;
            }

            // Grid container
            const rowStr = document.createElement('div');
            rowStr.className = 'row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4';

            // Get current selected items
            const selectedItems = dayData.auto_order[mealType] || [];

            availableMenu.forEach(food => {
                // Count how many times this food is in selectedItems
                const count = selectedItems.filter(item => item.id === food.id).length;

                const col = document.createElement('div');
                col.className = 'col';

                col.innerHTML = `
                    <div class="card h-100 ${count > 0 ? 'border-primary shadow-sm bg-light' : ''}">
                        <div class="card-body text-center d-flex flex-column">
                            <h6 class="card-title fw-bold mb-2">${food.name}</h6>
                            <p class="card-text text-danger fw-bold mb-3 mt-auto">￥${parseFloat(food.price).toFixed(2)}</p>
                            
                            <div class="d-flex justify-content-center align-items-center bg-white p-2 rounded border">
                                <button class="btn btn-sm btn-outline-secondary px-3 fw-bold fs-5" style="line-height:1;" onclick="changeQuantity('${dayKey}', '${mealType}', '${food.id}', -1)" ${count === 0 ? 'disabled' : ''}>-</button>
                                <span class="mx-3 fw-bold fs-5 text-primary" style="min-width: 20px;">${count}</span>
                                <button class="btn btn-sm btn-outline-primary px-3 fw-bold fs-5" style="line-height:1;" onclick="changeQuantity('${dayKey}', '${mealType}', '${food.id}', 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
                rowStr.appendChild(col);
            });

            container.appendChild(rowStr);
        }

        function changeQuantity(dayKey, mealType, foodId, delta) {
            const dayData = orderData[dayKey];
            const autoOrderList = dayData.auto_order[mealType];
            
            if (delta === 1) {
                // Add one: Find food in menu, append copy to autoOrderList
                const foodInfo = dayData.menu[mealType].find(f => f.id === foodId);
                if (foodInfo) {
                    autoOrderList.push({
                        id: foodInfo.id,
                        name: foodInfo.name,
                        price: parseFloat(foodInfo.price)
                    });
                }
            } else if (delta === -1) {
                // Remove one: Find first index of foodId in autoOrderList and remove
                const idx = autoOrderList.findIndex(item => item.id === foodId);
                if (idx !== -1) {
                    autoOrderList.splice(idx, 1);
                }
            }

            // re-render both
            renderChecksheet();
            renderMenuGrid();
        }

        async function saveOrder() {
            const statusParams = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(orderData) };
            try {
                const response = await fetch(`/pending_orders/${filename}/update`, statusParams);
                const result = await response.json();

                const msgDiv = document.getElementById('status-msg');
                msgDiv.classList.remove('d-none', 'alert-danger', 'alert-success');
                if (result.success) {
                    msgDiv.classList.add('alert-success');
                    msgDiv.innerText = '保存成功！';
                } else {
                    msgDiv.classList.add('alert-danger');
                    msgDiv.innerText = '保存失败: ' + result.message;
                }
            } catch (e) {
                alert('保存订单出错: ' + e);
            }
        }

        async function submitOrder() {
            await saveOrder();

            if (!confirm("确定要提交此订单吗？这会把订单最终提交到订餐系统。")) return;

            try {
                const response = await fetch(`/submit_order/${filename}`, { method: 'POST' });
                const result = await response.json();

                const msgDiv = document.getElementById('status-msg');
                msgDiv.classList.remove('d-none', 'alert-danger', 'alert-success');

                if (result.success) {
                    msgDiv.classList.add('alert-success');
                    msgDiv.innerText = result.message; // Consider translating message from backend if possible, or keeping as is if it's already translated
                } else {
                    msgDiv.classList.add('alert-danger');
                    msgDiv.innerText = '提交失败: ' + result.message;
                }
            } catch (e) {
                alert('提交订单出错: ' + e);
            }
        }

        // Initial render
        renderChecksheet();
        renderMenuGrid();
    </script>
</body>

</html>
